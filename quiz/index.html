  catalyseur: {

    emojis: ["⚡", "🔥", "💥", "🫀", "🌊"]

let currentQuestion = 0;
let scores = {};

function initQuiz() {
  Object.keys(archetypes).forEach(key => { scores[key] = 0; });
  showQuestion(0);
  revealElements();
}

function showQuestion(n) {
  const q = quizData[n];
  const html = `
    <div class="sk-question-num">Question ${n+1} / 8</div>
    <div class="sk-question-text">${q.question}</div>
    <div class="sk-answers">
      ${q.answers.map((a, i) => `
        <button class="sk-answer-btn" onclick="selectAnswer('${a.score}', ${n}, ${i})">
          ${a.text}
        </button>
      `).join('')}
    </div>
  `;
  document.getElementById('questionBlock').innerHTML = html;
  updateProgress(n);
}

function selectAnswer(key, qIdx, aIdx) {
  scores[key]++;
  currentQuestion++;
  document.querySelectorAll('.sk-answer-btn')[aIdx].classList.add('selected');
  gtag('event', 'quiz_answer', {event_category: 'engagement', event_label: key});
  setTimeout(() => {
    if (currentQuestion < quizData.length) {
      showQuestion(currentQuestion);
    } else {
      showResults();
    }
  }, 400);
}

function updateProgress(n) {
  const pct = ((n + 1) / quizData.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function getArchetype() {
  let max = 0, key = 'invisible';
  Object.keys(scores).forEach(k => {
    if (scores[k] > max) { max = scores[k]; key = k; }
  });
  return key;
}

function showResults() {
  const key = getArchetype();
  const a = archetypes[key];
  
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultsScreen').classList.add('active');
  
  document.getElementById('cardImage').style.backgroundImage = `url('${a.image}')`;
  document.getElementById('cardTitle').innerHTML = a.title;
  
  document.getElementById('archetypeSub').textContent = a.subtitle;
  document.getElementById('archetypeDesc').innerHTML = a.description;
  
  const scoresHtml = Object.keys(scores).map(k => {
    return `
      <div class="sk-score-item">
        <div class="sk-score-label">${archetypes[k].titlePlain}</div>
        <div class="sk-score-bar">
          <div class="sk-score-bar-fill" style="width:0%" id="bar-${k}"></div>
        </div>
        <div class="sk-score-count">${scores[k]} / 8</div>
      </div>
    `;
  }).join('');
  document.getElementById('scoresDisplay').innerHTML = scoresHtml;
  
  setTimeout(() => {
    Object.keys(scores).forEach(k => {
      const pct = (scores[k] / 8) * 100;
      document.getElementById(`bar-${k}`).style.width = pct + '%';
    });
  }, 100);
  
  document.getElementById('strengthBadges').innerHTML = a.emojis.map(e => 
    `<span class="sk-strength-badge">${e}</span>`
  ).join('');
  
  window.currentArchetype = key;
  window.currentArchetypeData = a;
  gtag('event', 'quiz_complete', {event_category: 'engagement', event_label: key});
  revealElements();
}

function applyCandidacy() {
  gtag('event', 'offre_redirect', {event_category: 'engagement', event_label: window.currentArchetype});
  const email = new URLSearchParams(window.location.search).get('email') || '';
  const params = new URLSearchParams({ archetype: window.currentArchetype });
  if (email) params.set('email', email);
  window.location.href = `/offre?${params.toString()}`;
}

function shareToSocials() {
  generateCardImage();
  gtag('event', 'share_click', {event_category: 'engagement', event_label: window.currentArchetype});
}

/* ==================== GÉNÉRATION CARTE PNG ==================== */

function generateCardImage() {
  const a = window.currentArchetypeData;
  const cvs = document.getElementById('canvas');
  
  // Format carte 1080x1620 (ratio 2:3)
  cvs.width = 1080;
  cvs.height = 1620;
  const ctx = cvs.getContext('2d');
  
  // Charger l'image archetype
  const img = new Image();
  img.crossOrigin = 'anonymous';
  
  img.onload = function() {
    // 1. Background bordeaux
    ctx.fillStyle = '#1E0A0A';
    ctx.fillRect(0, 0, 1080, 1620);
    
    // 2. Image archétype en fond (cover)
    const imgRatio = img.width / img.height;
    const cardRatio = 1080 / 1620;
    let drawW, drawH, drawX, drawY;
    if (imgRatio > cardRatio) {
      drawH = 1620;
      drawW = drawH * imgRatio;
      drawX = (1080 - drawW) / 2;
      drawY = 0;
    } else {
      drawW = 1080;
      drawH = drawW / imgRatio;
      drawX = 0;
      drawY = (1620 - drawH) / 2;
    }
    ctx.drawImage(img, drawX, drawY, drawW, drawH);
    
    // 3. Overlay gradient
    const grad = ctx.createLinearGradient(0, 0, 0, 1620);
    grad.addColorStop(0, 'rgba(30,10,10,.85)');
    grad.addColorStop(0.25, 'rgba(30,10,10,.3)');
    grad.addColorStop(0.55, 'rgba(30,10,10,.2)');
    grad.addColorStop(0.8, 'rgba(30,10,10,.7)');
    grad.addColorStop(1, 'rgba(30,10,10,.95)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1080, 1620);
    
    // 4. Bordure subtile dorée
    ctx.strokeStyle = 'rgba(242,214,117,.2)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, 1078, 1618);
    
    ctx.textAlign = 'center';
    
    // 5. EYEBROW "ARCHÉTYPE"
    ctx.font = '500 22px "Jost"';
    ctx.fillStyle = '#F2D675';
    ctx.fillText('— ARCHÉTYPE —', 540, 130);
    
    // 6. Titre archétype (avec italique sur le 2e mot)
    ctx.fillStyle = '#F5F0E8';
    drawTitleWithItalic(ctx, a.titlePlain, 540, 230, 1080);
    
    // BOTTOM
    
    // 8. Ligne dorée séparatrice
    ctx.strokeStyle = 'rgba(242,214,117,.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(490, 1380);
    ctx.lineTo(590, 1380);
    ctx.stroke();
    
    // 9. "Mon archétype business"
    ctx.font = 'italic 36px "Cormorant Garamond"';
    ctx.fillStyle = 'rgba(245,240,232,.7)';
    ctx.fillText('Mon archétype business', 540, 1450);
    
    // 10. @studio.k.digital
    ctx.font = '500 26px "Jost"';
    ctx.fillStyle = '#F2D675';
    ctx.letterSpacing = '4px';
    ctx.fillText('@STUDIO.K.DIGITAL', 540, 1510);
    
    // Convertir en blob pour partage/download
    cvs.toBlob(async function(blob) {
      const fileName = `archetype-${window.currentArchetype}-studiok.png`;
      const file = new File([blob], fileName, { type: 'image/png' });
      
      // Détecter mobile
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      
      // 1. Essayer Web Share API (mobile moderne)
      if (isMobile && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Mon archétype Studio K',
            text: `Je suis ${window.currentArchetypeData.titlePlain} — Studio K`
          });
          return;
        } catch (err) {
          // Si l'utilisateur annule ou erreur → fallback
          if (err.name !== 'AbortError') {
            showImageFallback(cvs.toDataURL('image/png'), fileName);
          }
          return;
        }
      }
      
      // 2. Mobile sans Web Share API → afficher l'image en grand pour appui long
      if (isMobile) {
        showImageFallback(cvs.toDataURL('image/png'), fileName);
        return;
      }
      
      // 3. Desktop → téléchargement classique
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = fileName;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  };
  
  img.onerror = function() {
    console.error('Image archetype non chargée');
    alert('Image en cours de chargement, réessaye dans 2 secondes !');
  };
  
  img.src = a.image;
}

function showImageFallback(dataUrl, fileName) {
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(30,10,10,.96);z-index:99999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5rem;overflow-y:auto;animation:fadeIn .3s ease;
  `;
  
  overlay.innerHTML = `
    <div style="text-align:center;max-width:420px;width:100%;">
      <p style="font-family:'Cormorant Garamond',serif;font-style:italic;color:#F2D675;font-size:1.05rem;margin-bottom:1.2rem;line-height:1.5;">
        Appuie longuement sur l'image<br/>pour la sauvegarder dans ta galerie
      </p>
      <img src="${dataUrl}" alt="Archétype" style="width:100%;max-width:380px;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin-bottom:1.5rem;display:block;margin-left:auto;margin-right:auto;"/>
      <button id="closeFallback" style="background:transparent;border:1px solid rgba(242,214,117,.3);color:#F2D675;padding:.9rem 2rem;font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;border-radius:2px;">Fermer</button>
    </div>
  `;
  
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  
  document.getElementById('closeFallback').onclick = function() {
    overlay.remove();
    document.body.style.overflow = '';
  };
}

function drawTitleWithItalic(ctx, text, x, y, maxWidth) {
  // Titre en 2 lignes : article + nom / qualificatif italique
  // Ex: "La Créatrice" / "Invisible"
  const words = text.split(' ');
  const lastWord = words.pop();
  const firstPart = words.join(' ');
  
  ctx.font = '64px "DM Serif Display"';
  ctx.fillStyle = '#F5F0E8';
  ctx.fillText(firstPart, x, y);
  
  ctx.font = 'italic 64px "DM Serif Display"';
  ctx.fillStyle = '#F2D675';
  ctx.fillText(lastWord, x, y + 75);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let currentY = y;
  
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i] + ' ';
    const metrics = ctx.measureText(testLine);
    
    if (metrics.width > maxWidth && i > 0) {
      ctx.fillText(line.trim(), x, currentY);
      line = words[i] + ' ';
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, currentY);
}

function revealElements() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      e.isIntersecting ? e.target.classList.add('on') : e.target.classList.remove('on');
    });
  }, { threshold: 0.18, rootMargin: '0px 0px -55px 0px' });
  document.querySelectorAll('.sk-rv').forEach(el => obs.observe(el));
}

window.addEventListener('DOMContentLoaded', initQuiz);
